workflows:
  ios-unsigned-ipa:
    name: NutriVision TR iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: iOS Kamera ve Galeri İzinlerini Ekle
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Yemeklerin hacmini ve kalorisini hesaplamak için kamera erişimi gereklidir.'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Yemeklerin hacmini ve kalorisini hesaplamak için kamera erişimi gereklidir.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Yemek fotoğraflarını seçip analiz etmek için galeri erişimi gereklidir.'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Yemek fotoğraflarını seçip analiz etmek için galeri erişimi gereklidir.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Çekilen yemek fotoğraflarını işlemek için izin gereklidir.'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Çekilen yemek fotoğraflarını işlemek için izin gereklidir.'" "$PLIST"
      - name: Bağımlılıkları Yükle ve iOS Senkronize Et
        script: |
          npm install
          npx cap sync ios
      - name: İmzasız IPA Oluştur (Sideloadly Uyumlu)
        script: |
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build" build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build" build
          fi
          mkdir -p Payload
          cp -r build/App.app Payload/
          zip -r NutriVisionTR.ipa Payload
    artifacts:
      - ios/App/NutriVisionTR.ipa
