workflows:
  ios-unsigned-ipa:
    name: NutriVision TR iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları Yükle ve iOS Senkronize Et
        script: |
          npm install
          npx cap sync ios
      - name: İmzasız IPA Oluştur (Sideloadly Uyumlu)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r NutriVisionTR.ipa Payload
    artifacts:
      - ios/App/NutriVisionTR.ipa
